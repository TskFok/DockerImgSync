{{define "credential_form"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{if .IsEdit}}编辑登录信息{{else}}新建登录信息{{end}}</title>
</head>
<body>
{{template "nav" .}}
<h1>{{if .IsEdit}}编辑登录信息{{else}}新建登录信息{{end}}</h1>
{{if .Error}}<p>{{.Error}}</p>{{end}}
<form action="{{.Action}}" method="post">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>名称 <input type="text" name="name" value="{{.Credential.Name}}"></label>
<label>用户名 <input type="text" name="username" value="{{.Credential.Username}}"></label>
<label>密码 <input type="password" name="password"></label>
{{if .IsEdit}}<p>密码留空表示不修改</p>{{end}}
<button type="submit">保存</button>
</form>
</body>
</html>
{{end}}
