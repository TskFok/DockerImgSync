{{define "credential_form"}}
{{template "head" .}}
<header class="page-head">
<div>
<p class="kicker">第 1 步 · 账号</p>
<h1>{{if .IsEdit}}编辑登录信息{{else}}新建登录信息{{end}}</h1>
<p class="lead">名称只在这个控制台里用来识别，不会发给仓库。</p>
</div>
</header>
{{if .Error}}<p class="alert alert-error" role="alert">{{.Error}}</p>{{end}}
<form class="form" action="{{.Action}}" method="post">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<fieldset>
<legend>账号</legend>
<div class="field">
<label for="name">名称</label>
<input id="name" type="text" name="name" value="{{.Credential.Name}}" autocomplete="off">
<p class="hint">例如「阿里云杭州」或「Docker Hub」。</p>
</div>
<div class="field">
<label for="username">用户名</label>
<input id="username" type="text" name="username" value="{{.Credential.Username}}" autocomplete="username" spellcheck="false">
</div>
<div class="field">
<label for="password">密码</label>
<input id="password" type="password" name="password" autocomplete="new-password">
{{if .IsEdit}}<p class="hint">密码留空表示不修改</p>{{else}}<p class="hint">保存后不会再显示明文密码。</p>{{end}}
</div>
</fieldset>
<div class="form-actions">
<button class="btn btn-primary" type="submit">保存</button>
<a class="btn" href="/credentials">返回列表</a>
</div>
</form>
{{template "foot" .}}
{{end}}
