{{define "credentials"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录信息</title>
</head>
<body>
{{template "nav" .}}
<h1>我的账号</h1>
{{if .Error}}<p>{{.Error}}</p>{{end}}
<p><a href="/credentials/new">新建</a></p>
<table>
<thead>
<tr><th>名称</th><th>用户名</th><th>操作</th></tr>
</thead>
<tbody>
{{range .Credentials}}
<tr>
<td>{{.Name}}</td>
<td>{{.Username}}</td>
<td>
<a href="/credentials/{{.ID}}/edit">编辑</a>
<form action="/credentials/{{.ID}}/delete" method="post">
<input type="hidden" name="csrf" value="{{$.CSRF}}">
<button type="submit">删除</button>
</form>
</td>
</tr>
{{end}}
</tbody>
</table>
</body>
</html>
{{end}}
