{{define "registries"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>目标仓库</title>
</head>
<body>
{{template "nav" .}}
<h1>目标仓库</h1>
{{if .Error}}<p>{{.Error}}</p>{{end}}
<p><a href="/registries/new">新建</a></p>
<table>
<thead>
<tr><th>名称</th><th>地址</th><th>命名空间</th><th>登录信息</th><th>操作</th></tr>
</thead>
<tbody>
{{range .Registries}}
<tr>
<td>{{.Name}}</td>
<td>{{.Address}}</td>
<td>{{.Namespace}}</td>
<td>{{.CredentialName}}</td>
<td>
<a href="/registries/{{.ID}}/edit">编辑</a>
<form action="/registries/{{.ID}}/delete" method="post">
<input type="hidden" name="csrf" value="{{$.CSRF}}">
<button type="submit">删除</button>
</form>
</td>
</tr>
{{end}}
</tbody>
</table>
</body>
</html>
{{end}}
